      /* Custom Form Controls */
      input[type="checkbox"] {
        appearance: none;
        background-color: transparent;
        margin: 0;
        font: inherit;
        color: currentColor;
        width: 1.15em;
        height: 1.15em;
        border: 2px solid #829ab1;
        border-radius: 0.25em;
        display: grid;
        place-content: center;
        transition: all 0.2s ease-in-out;
        cursor: pointer;
      }
      .dark input[type="checkbox"] {
        border-color: #486581;
      }
      input[type="checkbox"]::before {
        content: "";
        width: 0.65em;
        height: 0.65em;
        transform: scale(0);
        transition: 120ms transform ease-in-out;
        box-shadow: inset 1em 1em white;
        background-color: transparent;
        transform-origin: center;
        clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
      }
      input[type="checkbox"]:checked {
        background-color: #14b8a6; /* indigo-500 */
        border-color: #14b8a6;
        box-shadow: 0 0 10px rgba(20, 184, 166, 0.4);
      }
      input[type="checkbox"]:checked::before {
        transform: scale(1);
      }

      /* Text Inputs */
      .input-field {
        @apply bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all duration-300 dark:text-slate-200 shadow-inner;
      }

      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')

        document.documentElement.classList.remove('dark')
      }
