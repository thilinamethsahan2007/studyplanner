<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /*!
      * KaTeX v0.16.10
      */
      .katex{font:normal 1.21em KaTeX_Main,Times New Roman,serif;line-height:1.2;white-space:normal;text-indent:0}
    
      /* Scrollbar Styling - Apple style subtle rounded bars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.35);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.6);
      }
      .dark ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Custom Form Controls - Apple Checkbox */
      input[type="checkbox"] {
        appearance: none;
        background-color: transparent;
        margin: 0;
        font: inherit;
        color: currentColor;
        width: 1.25em;
        height: 1.25em;
        border: 2px solid #cbd5e1;
        border-radius: 9999px;
        display: grid;
        place-content: center;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        cursor: pointer;
      }
      .dark input[type="checkbox"] {
        border-color: #475569;
      }
      input[type="checkbox"]:hover {
        border-color: #007aff;
        transform: scale(1.05);
      }
      input[type="checkbox"]::before {
        content: "";
        width: 0.65em;
        height: 0.65em;
        transform: scale(0);
        transition: 150ms transform cubic-bezier(0.16, 1, 0.3, 1);
        background-color: white;
        border-radius: 9999px;
        clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
      }
      input[type="checkbox"]:checked {
        background-color: #007aff;
        border-color: #007aff;
        box-shadow: 0 0 12px rgba(0, 122, 255, 0.4);
      }
      input[type="checkbox"]:checked::before {
        transform: scale(1);
      }

      /* Text Inputs */
      .input-field {
        @apply bg-white/70 dark:bg-slate-900/60 backdrop-blur-md border border-slate-200/80 dark:border-white/10 rounded-2xl px-4 py-2.5 focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 outline-none transition-all duration-200 dark:text-slate-100 shadow-sm placeholder:text-slate-400;
      }

      /* Tactile press feedback */
      .press-scale {
        transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.15s ease;
      }
      .press-scale:active {
        transform: scale(0.97);
        opacity: 0.9;
      }

      /* iOS Clean Glass Utility Classes */
      .glass-card {
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(226, 232, 240, 0.8);
      }
      .dark .glass-card {
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(226, 232, 240, 0.85);
      }
      .dark .glass-panel {
        background: rgba(10, 14, 23, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>
    <script>
      // On page load or when changing themes, best to add inline in `head` to avoid FOUC
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'system-ui', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#007aff', // Apple System Blue
                600: '#0062cc',
                700: '#004fb0',
                800: '#003d8a',
                900: '#002f6c',
              }
            }
          },
        },
      }
    </script>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.4",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0",
        "recharts": "https://aistudiocdn.com/recharts@^3.2.1",
        "react-markdown": "https://esm.sh/react-markdown@9.0.1",
        "remark-math": "https://esm.sh/remark-math@6.0.0",
        "rehype-katex": "https://esm.sh/rehype-katex@7.0.0",
        "html-to-image": "https://esm.sh/html-to-image@1.11.11"
      }
    }
    </script>
  </head>
  <body class="bg-[#f8f9fc] text-slate-800 dark:bg-[#07090e] dark:text-slate-100 antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
